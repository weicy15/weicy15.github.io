name: Build site for EdgeOne

on:
  push:
    branches:
      - main
      - "agent/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: edgeone-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "2.7"
          bundler: "2.2.19"
          bundler-cache: true

      - name: Build Jekyll site
        env:
          JEKYLL_ENV: production
        run: bundle exec jekyll build --config _config.yml,_config.edgeone.yml --destination _site

      - name: Verify build output
        shell: bash
        run: |
          test -f _site/index.html
          test -f _site/robots.txt
          test -f _site/sitemap.xml

      - name: Publish static site branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          cd _site
          touch .nojekyll
          git init
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "Build EdgeOne site from ${GITHUB_SHA}"
          git push --force \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            HEAD:edgeone-pages
